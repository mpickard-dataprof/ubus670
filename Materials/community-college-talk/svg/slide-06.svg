<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Montserrat, Arial, sans-serif">
 <defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.12"/>
 </filter>
 <radialGradient id="clusterRed" cx="50%" cy="50%" r="55%">
 <stop offset="0%" stop-color="#C8102E" stop-opacity="0.22"/>
 <stop offset="70%" stop-color="#C8102E" stop-opacity="0.06"/>
 <stop offset="100%" stop-color="#C8102E" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="clusterNavy" cx="50%" cy="50%" r="55%">
 <stop offset="0%" stop-color="#1D428A" stop-opacity="0.20"/>
 <stop offset="70%" stop-color="#1D428A" stop-opacity="0.05"/>
 <stop offset="100%" stop-color="#1D428A" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="clusterTeal" cx="50%" cy="50%" r="55%">
 <stop offset="0%" stop-color="#00968F" stop-opacity="0.20"/>
 <stop offset="70%" stop-color="#00968F" stop-opacity="0.05"/>
 <stop offset="100%" stop-color="#00968F" stop-opacity="0"/>
 </radialGradient>
 <marker id="arrowGrey" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
 <polygon points="0 0, 10 4, 0 8" fill="#B0B0B0"/>
 </marker>
 </defs>

 <!-- Background -->
 <rect width="1920" height="1080" fill="#FAFAFA"/>

 <!-- ============ Title ============ -->
 <text x="960" y="88" text-anchor="middle" font-size="54" font-weight="800" fill="#1A1A1A">The Galaxy of Meaning</text>
 <text x="960" y="140" text-anchor="middle" font-size="28" font-weight="500" fill="#666666">AI converts every word into a point in a number-space. Similar meanings sit close together. Unrelated words sit far apart.</text>

 <!-- ============ Embedding plot frame ============ -->
 <!-- plot area: x 140..1500, y 190..860 -->
 <g>
 <!-- plot background -->
 <rect x="140" y="190" width="1360" height="670" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>

 <!-- subtle grid -->
 <g stroke="#F0F0F0" stroke-width="1">
 <line x1="140" y1="358" x2="1500" y2="358"/>
 <line x1="140" y1="525" x2="1500" y2="525"/>
 <line x1="140" y1="693" x2="1500" y2="693"/>
 <line x1="480" y1="190" x2="480" y2="860"/>
 <line x1="820" y1="190" x2="820" y2="860"/>
 <line x1="1160" y1="190" x2="1160" y2="860"/>
 </g>

 <!-- axes -->
 <line x1="180" y1="820" x2="1460" y2="820" stroke="#888888" stroke-width="2" marker-end="url(#arrowGrey)"/>
 <line x1="180" y1="820" x2="180" y2="230" stroke="#888888" stroke-width="2" marker-end="url(#arrowGrey)"/>

 <text x="1470" y="852" font-size="24" font-style="italic" fill="#888">dimension 1</text>
 <text x="192" y="220" font-size="24" font-style="italic" fill="#888">dimension 2</text>

 <!-- origin marker -->
 <circle cx="180" cy="820" r="3" fill="#888"/>

 <!-- explanatory caption inside plot (top-right) -->
 <!-- ============ CLUSTER 1: Payment status (lower-left) — RED ============ -->
 <g>
 <ellipse cx="400" cy="680" rx="200" ry="150" fill="url(#clusterRed)"/>
 <!-- internal edges -->
 <g stroke="#C8102E" stroke-opacity="0.35" stroke-width="1.5" fill="none">
 <line x1="330" y1="610" x2="430" y2="590"/>
 <line x1="430" y1="590" x2="510" y2="640"/>
 <line x1="510" y1="640" x2="470" y2="720"/>
 <line x1="470" y1="720" x2="380" y2="730"/>
 <line x1="380" y1="730" x2="300" y2="690"/>
 <line x1="300" y1="690" x2="330" y2="610"/>
 <line x1="430" y1="590" x2="380" y2="730"/>
 <line x1="470" y1="720" x2="300" y2="690"/>
 </g>
 <!-- points + labels -->
 <g fill="#C8102E">
 <circle cx="330" cy="610" r="7"/>
 <circle cx="430" cy="590" r="8"/>
 <circle cx="510" cy="640" r="7"/>
 <circle cx="470" cy="720" r="8"/>
 <circle cx="380" cy="730" r="7"/>
 <circle cx="300" cy="690" r="7"/>
 </g>
 <g font-size="24" font-weight="700" fill="#A00D24">
 <text x="280" y="600">"past due"</text>
 <text x="445" y="578">"late payment"</text>
 <text x="526" y="638">"overdue"</text>
 <text x="485" y="750">"delinquent"</text>
 <text x="330" y="756">"in arrears"</text>
 <text x="190" y="690">"not yet paid"</text>
 </g>
 <g transform="translate(400, 800)">
 <rect x="-130" y="-20" width="260" height="38" rx="19" fill="#C8102E" filter="url(#shadow)"/>
 <text y="6" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">payment-status region</text>
 </g>
 </g>

 <!-- ============ CLUSTER 2: Depreciation (center-upper) — NAVY ============ -->
 <g>
 <ellipse cx="900" cy="380" rx="210" ry="160" fill="url(#clusterNavy)"/>
 <g stroke="#1D428A" stroke-opacity="0.35" stroke-width="1.5" fill="none">
 <line x1="820" y1="310" x2="920" y2="290"/>
 <line x1="920" y1="290" x2="1010" y2="340"/>
 <line x1="1010" y1="340" x2="970" y2="420"/>
 <line x1="970" y1="420" x2="880" y2="430"/>
 <line x1="880" y1="430" x2="800" y2="390"/>
 <line x1="800" y1="390" x2="820" y2="310"/>
 <line x1="920" y1="290" x2="880" y2="430"/>
 <line x1="970" y1="420" x2="800" y2="390"/>
 </g>
 <g fill="#1D428A">
 <circle cx="820" cy="310" r="7"/>
 <circle cx="920" cy="290" r="8"/>
 <circle cx="1010" cy="340" r="7"/>
 <circle cx="970" cy="420" r="8"/>
 <circle cx="880" cy="430" r="7"/>
 <circle cx="800" cy="390" r="7"/>
 </g>
 <g font-size="24" font-weight="700" fill="#14306A">
 <text x="715" y="300">"depreciation"</text>
 <text x="935" y="278">"amortization"</text>
 <text x="1026" y="338">"useful life"</text>
 <text x="986" y="450">"straight-line"</text>
 <text x="800" y="456">"salvage value"</text>
 <text x="685" y="390">"book value"</text>
 </g>
 <g transform="translate(900, 500)">
 <rect x="-140" y="-20" width="280" height="38" rx="19" fill="#1D428A" filter="url(#shadow)"/>
 <text y="6" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">depreciation region</text>
 </g>
 </g>

 <!-- ============ CLUSTER 3: Audit (right-middle) — TEAL ============ -->
 <g>
 <ellipse cx="1320" cy="620" rx="200" ry="150" fill="url(#clusterTeal)"/>
 <g stroke="#00968F" stroke-opacity="0.35" stroke-width="1.5" fill="none">
 <line x1="1240" y1="560" x2="1340" y2="540"/>
 <line x1="1340" y1="540" x2="1420" y2="590"/>
 <line x1="1420" y1="590" x2="1390" y2="670"/>
 <line x1="1390" y1="670" x2="1300" y2="680"/>
 <line x1="1300" y1="680" x2="1220" y2="640"/>
 <line x1="1220" y1="640" x2="1240" y2="560"/>
 <line x1="1340" y1="540" x2="1300" y2="680"/>
 </g>
 <g fill="#00968F">
 <circle cx="1240" cy="560" r="7"/>
 <circle cx="1340" cy="540" r="8"/>
 <circle cx="1420" cy="590" r="7"/>
 <circle cx="1390" cy="670" r="8"/>
 <circle cx="1300" cy="680" r="7"/>
 <circle cx="1220" cy="640" r="7"/>
 </g>
 <g font-size="24" font-weight="700" fill="#006F6A">
 <text x="1160" y="548">"reconcile"</text>
 <text x="1358" y="528">"audit trail"</text>
 <text x="1434" y="590">"verify"</text>
 <text x="1404" y="698">"supporting docs"</text>
 <text x="1232" y="706">"tie out"</text>
 <text x="1100" y="640">"cross-check"</text>
 </g>
 <g transform="translate(1320, 750)">
 <rect x="-115" y="-20" width="230" height="38" rx="19" fill="#00968F" filter="url(#shadow)"/>
 <text y="6" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">audit region</text>
 </g>
 </g>

 <!-- ============ Lonely outlier — "unicorn" — upper far-right ============ -->
 <g>
 <circle cx="1380" cy="280" r="10" fill="#999999"/>
 <text x="1380" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#777777">"unicorn"</text>
 <text x="1380" y="310" text-anchor="middle" font-size="16" font-style="italic" fill="#999">(unrelated to any cluster)</text>
 </g>

 <!-- ============ Vector-style distance annotation between two regions ============ -->
 <g>
 <line x1="510" y1="640" x2="820" y2="310"
 stroke="#999999" stroke-width="1.5" stroke-dasharray="6,5"/>
 <g transform="translate(665, 495) rotate(-46)">
 <rect x="-120" y="-18" width="240" height="32" rx="16" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
 <text y="5" text-anchor="middle" font-size="21" fill="#666">semantically distant</text>
 </g>
 </g>

 <!-- Short arc note between tight neighbors (intra-cluster) -->
 <g>
 <path d="M 430 590 Q 480 578 510 640" stroke="#C8102E" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.7"/>
 <g transform="translate(540, 570)">
 <rect x="0" y="-16" width="176" height="28" rx="14" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
 <text x="88" y="4" text-anchor="middle" font-size="21" font-weight="600" fill="#A00D24">nearly identical meaning</text>
 </g>
 </g>
 </g>

 <!-- ============ Bottom insight bar (single column) ============ -->
 <g transform="translate(960, 880)">
 <rect x="-850" y="0" width="1700" height="180" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" filter="url(#shadow)"/>
 <!-- bullet 1 -->
 <g transform="translate(-820, 16)">
 <circle cx="24" cy="30" r="22" fill="#C8102E"/>
 <text x="24" y="39" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">1</text>
 <text x="66" y="26" font-size="26" font-weight="700" fill="#1A1A1A">Meaning is position.</text>
 <text x="66" y="56" font-size="22" fill="#444">The AI places every word at a specific spot &#8594; same meaning sit in the same neighborhood.</text>
 </g>
 <!-- bullet 2 -->
 <g transform="translate(-820, 100)">
 <circle cx="24" cy="30" r="22" fill="#1D428A"/>
 <text x="24" y="39" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">2</text>
 <text x="66" y="26" font-size="26" font-weight="700" fill="#1A1A1A">Why accountants should care.</text>
 <text x="66" y="56" font-size="22" fill="#444">AI can scan 10,000 transactions and match "refund" to "money back," "credit issued," or "returned item."</text>
 </g>
 </g>
</svg>
