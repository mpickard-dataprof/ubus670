 <!-- Bottom insight -->
 <g transform="translate(960, 820)">
 <rect x="-700" y="0" width="1400" height="140" rx="16" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <circle cx="-660" cy="70" r="28" fill="#C8102E"/>
 <text x="-660" y="79" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF"></text>
 <text x="-616" y="52" font-size="28" font-weight="700" fill="#1A1A1A">Audit, AP, AR, fraud detection &#8212; all built on "find records that MEAN the same thing."</text>
 <text x="-616" y="86" font-size="24" fill="#444">Traditional software only finds exact words. AI finds concepts. That's a 10&#215; improvement in coverage</text>
 <text x="-616" y="112" font-size="24" fill="#444">for anyone who reviews transaction descriptions, journal entry memos, or vendor notes.</text>
