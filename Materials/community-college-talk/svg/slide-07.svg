<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Montserrat, Arial, sans-serif">
 <defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.14"/>
 </filter>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
 <feGaussianBlur stdDeviation="4" result="b"/>
 <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 </defs>

 <rect width="1920" height="1080" fill="#FAFAFA"/>

 <!-- Title -->
 <text x="960" y="88" text-anchor="middle" font-size="54" font-weight="800" fill="#1A1A1A">Why This Matters for YOU</text>
 <text x="960" y="140" text-anchor="middle" font-size="28" font-weight="500" fill="#666666">Search by MEANING, not by exact words — the real superpower for transaction review</text>

 <!-- ============ LEFT: Keyword search (old way) ============ -->
 <g transform="translate(90, 200)">
 <!-- header -->
 <rect x="0" y="0" width="820" height="56" rx="10" fill="#8B8B8B"/>
 <text x="24" y="38" font-size="25" font-weight="700" fill="#FFFFFF"> OLD WAY: KEYWORD SEARCH (Ctrl+F)</text>

 <!-- search bar -->
 <g transform="translate(0, 80)">
 <rect x="0" y="0" width="820" height="60" rx="8" fill="#FFFFFF" stroke="#DDDDDD"/>
 <text x="20" y="38" font-size="24" fill="#666"></text>
 <text x="60" y="40" font-size="28" font-weight="700" fill="#222">refund</text>
 <text x="790" y="40" text-anchor="end" font-size="24" font-style="italic" fill="#888">exact-match only</text>
 </g>

 <!-- results list -->
 <g transform="translate(0, 160)">
 <!-- row headers -->
 <rect x="0" y="0" width="820" height="38" rx="6" fill="#F0F0F0"/>
 <text x="22" y="25" font-size="21" font-weight="700" fill="#666" letter-spacing="1">DATE</text>
 <text x="120" y="25" font-size="21" font-weight="700" fill="#666" letter-spacing="1">DESCRIPTION</text>
 <text x="640" y="25" font-size="21" font-weight="700" fill="#666" letter-spacing="1">AMOUNT</text>
 <text x="780" y="25" font-size="21" font-weight="700" fill="#666" text-anchor="end" letter-spacing="1">MATCH?</text>

