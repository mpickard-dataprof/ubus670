 <!-- footer stats -->
 <g transform="translate(0, 346)">
 <rect x="0" y="0" width="820" height="52" rx="8" fill="#F7F7F7"/>
 <text x="24" y="33" font-size="24" fill="#444"><tspan font-weight="700" fill="#C8102E">3 found</tspan>, 4 missed &#8212; <tspan font-style="italic">real money you would miss in a review</tspan></text>
