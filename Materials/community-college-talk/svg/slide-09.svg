<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Montserrat, Arial, sans-serif">
 <defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.14"/>
 </filter>
 <marker id="attArrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
 <polygon points="0 0, 10 4, 0 8" fill="#C8102E"/>
 </marker>
 <marker id="attArrowGrey" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
 <polygon points="0 0, 9 3.5, 0 7" fill="#BBBBBB"/>
 </marker>
 </defs>

 <rect width="1920" height="1080" fill="#FAFAFA"/>

 <text x="960" y="88" text-anchor="middle" font-size="54" font-weight="800" fill="#1A1A1A">Attention: How AI Reads in Context</text>
 <text x="960" y="140" text-anchor="middle" font-size="28" font-weight="500" fill="#666666">For every word, AI looks at every other word in the sentence and decides which ones matter most.</text>

 <!-- =============== TOP: Sample sentence with tokens as tiles =============== -->
 <g transform="translate(150, 220)">
 <text x="0" y="-16" font-size="24" font-weight="700" fill="#888" letter-spacing="2">INPUT SENTENCE</text>
 <!-- tiles -->
 <g font-size="28" font-weight="700">
 <g><rect x="0" y="0" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/><text x="75" y="46" text-anchor="middle" fill="#333">Calculate</text></g>
 <g><rect x="160" y="0" width="60" height="70" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/><text x="190" y="46" text-anchor="middle" fill="#333">the</text></g>
 <!-- FOCUS WORD: depreciation -->
 <g>
 <rect x="230" y="0" width="220" height="70" rx="10" fill="#C8102E" stroke="#A00D24" stroke-width="2" filter="url(#shadow)"/>
 <text x="340" y="46" text-anchor="middle" fill="#FFFFFF">depreciation</text>
 </g>
 <g><rect x="460" y="0" width="70" height="70" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/><text x="495" y="46" text-anchor="middle" fill="#333">on</text></g>
 <g><rect x="540" y="0" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/><text x="580" y="46" text-anchor="middle" fill="#333">the</text></g>
 <!-- HIGH-ATTENTION WORD: delivery -->
 <g>
 <rect x="630" y="0" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#1D428A" stroke-width="3" filter="url(#shadow)"/>
 <text x="720" y="46" text-anchor="middle" font-weight="800" fill="#1D428A">delivery</text>
 </g>
 <!-- HIGH-ATTENTION WORD: truck -->
 <g>
 <rect x="820" y="0" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#1D428A" stroke-width="3" filter="url(#shadow)"/>
 <text x="895" y="46" text-anchor="middle" font-weight="800" fill="#1D428A">truck</text>
 </g>
 <g><rect x="980" y="0" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/><text x="1045" y="46" text-anchor="middle" fill="#333">using</text></g>
 <!-- HIGH-ATTENTION: 5 -->
 <g>
 <rect x="1120" y="0" width="60" height="70" rx="10" fill="#FFFFFF" stroke="#1D428A" stroke-width="3" filter="url(#shadow)"/>
 <text x="1150" y="46" text-anchor="middle" font-weight="800" fill="#1D428A">5</text>
 </g>
 <!-- HIGH-ATTENTION: year -->
 <g>
 <rect x="1190" y="0" width="100" height="70" rx="10" fill="#FFFFFF" stroke="#1D428A" stroke-width="3" filter="url(#shadow)"/>
 <text x="1240" y="46" text-anchor="middle" font-weight="800" fill="#1D428A">year</text>
 </g>
 <g><rect x="1300" y="0" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/><text x="1395" y="46" text-anchor="middle" fill="#333">straight-line</text></g>
 <g><rect x="1500" y="0" width="100" height="70" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/><text x="1550" y="46" text-anchor="middle" fill="#333">method</text></g>
 <g><rect x="1610" y="0" width="30" height="70" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1.5"/><text x="1625" y="46" text-anchor="middle" fill="#333">.</text></g>
 </g>
 </g>

 <!-- =============== CENTER: Attention arrows from "depreciation" to every other word box =============== -->
 <!-- "depreciation" focus tile: world (380..600, 220..290). Arrows leave from bottom-center (490, 290).
      Arrowheads are manually rotated polygons (cairosvg doesn't honor orient=auto on curved paths).
      Each polygon's apex sits at the path endpoint, rotated so it points along the path's tangent. -->
 <g>
 <!-- RED high-attention paths -->
 <path d="M 490 290 Q 767 490 1045 290" stroke="#C8102E" stroke-width="6" fill="none" opacity="1.0"/>
 <path d="M 490 290 Q 680 450 870 290"  stroke="#C8102E" stroke-width="5" fill="none" opacity="0.9"/>
 <path d="M 490 290 Q 895 510 1300 290" stroke="#C8102E" stroke-width="4" fill="none" opacity="0.85"/>
 <path d="M 490 290 Q 940 520 1390 290" stroke="#C8102E" stroke-width="3.5" fill="none" opacity="0.8"/>

 <!-- RED arrowheads (apex at path-end, rotated by tangent angle) -->
 <polygon points="0,0 -16,-7 -16,7" fill="#C8102E" opacity="1.0"  transform="translate(1045,290) rotate(-35.8)"/>
 <polygon points="0,0 -15,-6 -15,6" fill="#C8102E" opacity="0.9"  transform="translate(870,290)  rotate(-40.1)"/>
 <polygon points="0,0 -14,-6 -14,6" fill="#C8102E" opacity="0.85" transform="translate(1300,290) rotate(-28.5)"/>
 <polygon points="0,0 -13,-5 -13,5" fill="#C8102E" opacity="0.8"  transform="translate(1390,290) rotate(-27.1)"/>

 <!-- GREY low-attention paths -->
 <path d="M 490 290 Q 357 380 225 290"  stroke="#BBBBBB" stroke-width="1.5" fill="none" opacity="0.6"/>
 <path d="M 490 290 Q 415 360 340 290"  stroke="#BBBBBB" stroke-width="1.5" fill="none" opacity="0.6"/>
 <path d="M 490 290 Q 567 370 645 290"  stroke="#BBBBBB" stroke-width="1.5" fill="none" opacity="0.6"/>
 <path d="M 490 290 Q 610 380 730 290"  stroke="#BBBBBB" stroke-width="1.5" fill="none" opacity="0.6"/>
 <path d="M 490 290 Q 842 470 1195 290" stroke="#BBBBBB" stroke-width="1.5" fill="none" opacity="0.55"/>
 <path d="M 490 290 Q 1017 510 1545 290" stroke="#BBBBBB" stroke-width="1.5" fill="none" opacity="0.55"/>
 <path d="M 490 290 Q 1095 520 1700 290" stroke="#BBBBBB" stroke-width="1.5" fill="none" opacity="0.55"/>
 <path d="M 490 290 Q 1132 525 1775 290" stroke="#BBBBBB" stroke-width="1.5" fill="none" opacity="0.5"/>

 <!-- GREY arrowheads -->
 <polygon points="0,0 -10,-4 -10,4" fill="#BBBBBB" opacity="0.6"  transform="translate(225,290)  rotate(-145.7)"/>
 <polygon points="0,0 -10,-4 -10,4" fill="#BBBBBB" opacity="0.6"  transform="translate(340,290)  rotate(-137.0)"/>
 <polygon points="0,0 -10,-4 -10,4" fill="#BBBBBB" opacity="0.6"  transform="translate(645,290)  rotate(-45.7)"/>
 <polygon points="0,0 -10,-4 -10,4" fill="#BBBBBB" opacity="0.6"  transform="translate(730,290)  rotate(-36.9)"/>
 <polygon points="0,0 -10,-4 -10,4" fill="#BBBBBB" opacity="0.55" transform="translate(1195,290) rotate(-27.0)"/>
 <polygon points="0,0 -10,-4 -10,4" fill="#BBBBBB" opacity="0.55" transform="translate(1545,290) rotate(-22.6)"/>
 <polygon points="0,0 -10,-4 -10,4" fill="#BBBBBB" opacity="0.55" transform="translate(1700,290) rotate(-20.8)"/>
 <polygon points="0,0 -10,-4 -10,4" fill="#BBBBBB" opacity="0.5"  transform="translate(1775,290) rotate(-20.1)"/>
 </g>

 <!-- =============== Attention strength panel (bottom left) =============== -->
 <g transform="translate(90, 560)">
 <text x="0" y="0" font-size="24" font-weight="700" fill="#888" letter-spacing="2">ATTENTION WEIGHTS FROM "DEPRECIATION"</text>

 <!-- bar chart -->
 <g font-size="24" fill="#333">
 <!-- HIGH attention -->
 <g transform="translate(0, 30)">
 <text x="0" y="22" font-weight="700" fill="#1D428A">"truck"</text>
 <rect x="180" y="6" width="540" height="20" rx="4" fill="#1D428A"/>
 <text x="732" y="22" font-size="21" fill="#1D428A" font-weight="700">0.37</text>
 </g>
 <g transform="translate(0, 60)">
 <text x="0" y="22" font-weight="700" fill="#1D428A">"delivery"</text>
 <rect x="180" y="6" width="410" height="20" rx="4" fill="#1D428A"/>
 <text x="602" y="22" font-size="21" fill="#1D428A" font-weight="700">0.28</text>
 </g>
 <g transform="translate(0, 90)">
 <text x="0" y="22" font-weight="700" fill="#1D428A">"5"</text>
 <rect x="180" y="6" width="220" height="20" rx="4" fill="#1D428A"/>
 <text x="412" y="22" font-size="21" fill="#1D428A" font-weight="700">0.15</text>
 </g>
 <g transform="translate(0, 120)">
 <text x="0" y="22" font-weight="700" fill="#1D428A">"year"</text>
 <rect x="180" y="6" width="180" height="20" rx="4" fill="#1D428A"/>
 <text x="372" y="22" font-size="21" fill="#1D428A" font-weight="700">0.12</text>
 </g>
 <g transform="translate(0, 150)">
 <text x="0" y="22" font-weight="700" fill="#1D428A">"straight-line"</text>
 <rect x="180" y="6" width="105" height="20" rx="4" fill="#1D428A"/>
 <text x="297" y="22" font-size="21" fill="#1D428A" font-weight="700">0.06</text>
 </g>
 <!-- LOW attention -->
 <g transform="translate(0, 180)">
 <text x="0" y="22" fill="#999">function words</text>
 <rect x="180" y="6" width="20" height="20" rx="4" fill="#BBBBBB"/>
 <text x="212" y="22" font-size="21" fill="#999" font-weight="700">&lt; 0.01 each</text>
 </g>
 </g>
 </g>

 <!-- =============== Right: plain-English explanation =============== -->
 <g transform="translate(950, 580)">
 <rect x="0" y="0" width="860" height="240" rx="14" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <rect x="0" y="0" width="8" height="240" rx="4" fill="#C8102E"/>

 <text x="30" y="46" font-size="28" font-weight="800" fill="#1A1A1A">What the AI "decides"</text>
 <text x="30" y="86" font-size="24" fill="#333"><tspan font-weight="700" fill="#1D428A">"delivery"</tspan> and <tspan font-weight="700" fill="#1D428A">"truck"</tspan> tell it: this is a <tspan font-weight="700">physical asset</tspan> —</text>
 <text x="30" y="114" font-size="24" fill="#333">not "reputation depreciation," not "currency depreciation."</text>

 <text x="30" y="158" font-size="24" fill="#333"><tspan font-weight="700" fill="#1D428A">"5"</tspan> and <tspan font-weight="700" fill="#1D428A">"year"</tspan> tell it: the useful life is 5 years.</text>

 <text x="30" y="200" font-size="24" fill="#333">All the <tspan font-style="italic" fill="#888">"the / on / method"</tspan> words get almost zero attention —</text>
 <text x="30" y="224" font-size="24" fill="#333">they carry little meaning for this question.</text>
 </g>

 <!-- Bottom insight -->
 <g transform="translate(960, 880)">
 <rect x="-850" y="0" width="1700" height="130" rx="16" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <circle cx="-810" cy="66" r="26" fill="#1D428A"/>
 <text x="-810" y="76" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">!</text>
 <text x="-770" y="50" font-size="25" font-weight="700" fill="#1A1A1A">Attention is why modern AI handles ambiguous accounting language.</text>
 <text x="-770" y="80" font-size="25" fill="#444">"Close the books," "bank reconciliation," "post to the account," "allowance for doubtful accounts" &#8212;</text>
 <text x="-770" y="104" font-size="25" fill="#444">each has a specific meaning only if the AI looks at surrounding words. Attention is that lookup.</text>
 </g>
</svg>
