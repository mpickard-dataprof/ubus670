<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Montserrat, Arial, sans-serif">
 <defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.14"/>
 </filter>
 </defs>

 <rect width="1920" height="1080" fill="#FAFAFA"/>

 <text x="960" y="88" text-anchor="middle" font-size="54" font-weight="800" fill="#1A1A1A">For Today's Exercises &#8212; Use Any of These</text>
 <text x="960" y="140" text-anchor="middle" font-size="28" font-weight="500" fill="#666666">All three have free tiers. All three work for today's prompts. Pick whichever you already have open.</text>

 <!-- ===== 3 tool cards ===== -->
 <!-- each card 520 wide, y=210 -->

 <!-- GEMINI -->
 <g transform="translate(110, 210)">
 <rect x="0" y="0" width="520" height="600" rx="18" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>

 <!-- colored header -->
 <rect x="0" y="0" width="520" height="150" rx="18" fill="#1D428A"/>
 <!-- gem/diamond icon -->
 <g transform="translate(80, 50)">
 <polygon points="50,0 100,30 70,100 30,100 0,30" fill="#FFFFFF"/>
 <polygon points="50,0 100,30 70,100" fill="#FFFFFF" opacity="0.65"/>
 <polygon points="50,0 30,100 0,30" fill="#FFFFFF" opacity="0.85"/>
 </g>
 <text x="230" y="90" font-size="40" font-weight="800" fill="#FFFFFF">Gemini</text>
 <text x="230" y="124" font-size="24" fill="#FFFFFF" opacity="0.85">by Google</text>

 <!-- URL bar -->
 <g transform="translate(24, 170)">
 <rect x="0" y="0" width="472" height="40" rx="20" fill="#F3F6FC" stroke="#D7E1F3"/>
 <text x="18" y="26" font-size="21" fill="#888"></text>
 <text x="46" y="26" font-size="25" font-weight="700" fill="#1D428A">gemini.google.com</text>
 </g>

 <!-- features -->
 <g transform="translate(24, 240)" font-size="24" fill="#333">
 <text y="0" font-size="21" font-weight="700" fill="#888" letter-spacing="2">BEST FOR</text>
 <text y="30">&#8226; Free tier includes file uploads</text>
 <text y="60">&#8226; Works natively with Google Docs</text>
 <text y="90">&#8226; Large context (fits long PDFs)</text>
 <text y="120">&#8226; Fast responses</text>
 </g>

 <!-- example use -->
 <g transform="translate(24, 430)">
 <rect x="0" y="0" width="472" height="100" rx="10" fill="#F3F6FC"/>
 <text x="16" y="28" font-size="21" font-weight="700" fill="#1D428A" letter-spacing="2">GOOD FIT</text>
 <text x="16" y="54" font-size="24" fill="#333">Uploading a PDF to ask specific</text>
 <text x="16" y="76" font-size="24" fill="#333">questions about it (today's Exercise 4).</text>
 </g>

 <!-- login note -->
 <text x="260" y="568" text-anchor="middle" font-size="21" font-style="italic" fill="#888">sign in with any Google account</text>
 </g>

 <!-- CHATGPT -->
 <g transform="translate(700, 210)">
 <rect x="0" y="0" width="520" height="600" rx="18" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>

 <rect x="0" y="0" width="520" height="150" rx="18" fill="#1A1A1A"/>
 <!-- speech bubble icon -->
 <g transform="translate(80, 50)" fill="#FFFFFF">
 <path d="M 0 20 Q 0 0 20 0 L 80 0 Q 100 0 100 20 L 100 60 Q 100 80 80 80 L 40 80 L 20 100 L 25 80 L 20 80 Q 0 80 0 60 Z"/>
 </g>
 <text x="230" y="90" font-size="40" font-weight="800" fill="#FFFFFF">ChatGPT</text>
 <text x="230" y="124" font-size="24" fill="#FFFFFF" opacity="0.85">by OpenAI</text>

 <g transform="translate(24, 170)">
 <rect x="0" y="0" width="472" height="40" rx="20" fill="#F3F3F3" stroke="#DDDDDD"/>
 <text x="18" y="26" font-size="21" fill="#888"></text>
 <text x="46" y="26" font-size="25" font-weight="700" fill="#1A1A1A">chatgpt.com</text>
 </g>

 <g transform="translate(24, 240)" font-size="24" fill="#333">
 <text y="0" font-size="21" font-weight="700" fill="#888" letter-spacing="2">BEST FOR</text>
 <text y="30">&#8226; Most popular &#8212; you likely have it</text>
 <text y="60">&#8226; Strong at drafting professional text</text>
 <text y="90">&#8226; Good at step-by-step reasoning</text>
 <text y="120">&#8226; File uploads on free tier</text>
 </g>

 <g transform="translate(24, 430)">
 <rect x="0" y="0" width="472" height="100" rx="10" fill="#F3F3F3"/>
 <text x="16" y="28" font-size="21" font-weight="700" fill="#1A1A1A" letter-spacing="2">GOOD FIT</text>
 <text x="16" y="54" font-size="24" fill="#333">Drafting client emails, memos, and</text>
 <text x="16" y="76" font-size="24" fill="#333">cover letters (today's Exercises 2, 3).</text>
 </g>

 <text x="260" y="568" text-anchor="middle" font-size="21" font-style="italic" fill="#888">sign in with email or Google</text>
 </g>

 <!-- CLAUDE -->
 <g transform="translate(1290, 210)">
 <rect x="0" y="0" width="520" height="600" rx="18" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>

 <rect x="0" y="0" width="520" height="150" rx="18" fill="#CC785C"/>
 <!-- starburst icon -->
 <g transform="translate(130, 75)" fill="#FFFFFF">
 <path d="M 0 -40 L 8 -8 L 40 0 L 8 8 L 0 40 L -8 8 L -40 0 L -8 -8 Z"/>
 <path d="M 0 -22 L 4 -4 L 22 0 L 4 4 L 0 22 L -4 4 L -22 0 L -4 -4 Z" fill="#CC785C"/>
 </g>
 <text x="230" y="90" font-size="40" font-weight="800" fill="#FFFFFF">Claude</text>
 <text x="230" y="124" font-size="24" fill="#FFFFFF" opacity="0.85">by Anthropic</text>

 <g transform="translate(24, 170)">
 <rect x="0" y="0" width="472" height="40" rx="20" fill="#FAF4F0" stroke="#E8D5CA"/>
 <text x="18" y="26" font-size="21" fill="#888"></text>
 <text x="46" y="26" font-size="25" font-weight="700" fill="#8B4A30">claude.ai</text>
 </g>

 <g transform="translate(24, 240)" font-size="24" fill="#333">
 <text y="0" font-size="21" font-weight="700" fill="#888" letter-spacing="2">BEST FOR</text>
 <text y="30">&#8226; Strong at careful, nuanced writing</text>
 <text y="60">&#8226; Honest about uncertainty</text>
 <text y="90">&#8226; Very large context &#8212; long docs OK</text>
 <text y="120">&#8226; File uploads on free tier</text>
 </g>

 <g transform="translate(24, 430)">
 <rect x="0" y="0" width="472" height="100" rx="10" fill="#FAF4F0"/>
 <text x="16" y="28" font-size="21" font-weight="700" fill="#8B4A30" letter-spacing="2">GOOD FIT</text>
 <text x="16" y="54" font-size="24" fill="#333">Reviewing long policy PDFs or</text>
 <text x="16" y="76" font-size="24" fill="#333">draft memos for tone and clarity.</text>
 </g>

 <text x="260" y="568" text-anchor="middle" font-size="21" font-style="italic" fill="#888">sign in with email or Google</text>
 </g>

 <!-- ===== Bottom bar ===== -->
 <g transform="translate(960, 860)">
 <rect x="-850" y="0" width="1700" height="140" rx="16" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <circle cx="-810" cy="70" r="28" fill="#1D428A"/>
 <text x="-810" y="79" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">i</text>
 <text x="-770" y="50" font-size="28" font-weight="700" fill="#1A1A1A">Don't overthink which one to pick.</text>
 <text x="-770" y="80" font-size="24" fill="#444">For everything in today's exercises they behave the same. The <tspan font-weight="700">skill</tspan> transfers across tools.</text>
 <text x="-770" y="108" font-size="24" fill="#444">Learn the principles once &#8212; then switch between them depending on what your employer gives you access to.</text>
 </g>
</svg>
