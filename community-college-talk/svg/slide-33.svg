<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Montserrat, Arial, sans-serif">
 <defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.14"/>
 </filter>
 <marker id="stepArrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
 <polygon points="0 0, 10 4, 0 8" fill="#C8102E"/>
 </marker>
 </defs>

 <rect width="1920" height="1080" fill="#FAFAFA"/>

 <text x="960" y="88" text-anchor="middle" font-size="54" font-weight="800" fill="#1A1A1A">Your Homework &#8212; Real Homework, Not Optional</text>
 <text x="960" y="140" text-anchor="middle" font-size="28" font-weight="500" fill="#666666">One week. One task. One prompt. That's how this turns into a skill.</text>

 <!-- ============ 4-step roadmap ============ -->
 <!-- Each step: circled number + title + desc, arrows between them -->

 <g transform="translate(100, 220)">
 <!-- Step 1 -->
 <g>
 <rect x="0" y="0" width="380" height="400" rx="16" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <circle cx="190" cy="80" r="44" fill="#C8102E"/>
 <text x="190" y="96" text-anchor="middle" font-size="42" font-weight="800" fill="#FFFFFF">1</text>
 <text x="190" y="156" text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">PICK ONE TASK</text>

 <g transform="translate(30, 180)" font-size="24" fill="#333">
 <text y="24">Something you do <tspan font-weight="700">every week</tspan>:</text>
 <text y="68">&#8226; Drafting a client email</text>
 <text y="94">&#8226; Categorizing expenses</text>
 <text y="120">&#8226; Summarizing a transaction list</text>
 <text y="146">&#8226; Explaining a concept to a classmate</text>
 <text y="172">&#8226; Writing a memo or discussion post</text>

 <rect x="0" y="190" width="320" height="40" rx="20" fill="#FDECEE"/>
 <text x="160" y="216" text-anchor="middle" font-size="21" font-weight="700" fill="#A00D24">Small &amp; repeatable &gt; big &amp; rare</text>
 </g>
 </g>

 <!-- arrow 1->2 -->
 <path d="M 388 420 L 428 420" stroke="#C8102E" stroke-width="4" marker-end="url(#stepArrow)"/>

 <!-- Step 2 -->
 <g transform="translate(435, 0)">
 <rect x="0" y="0" width="380" height="400" rx="16" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <circle cx="190" cy="80" r="44" fill="#1D428A"/>
 <text x="190" y="96" text-anchor="middle" font-size="42" font-weight="800" fill="#FFFFFF">2</text>
 <text x="190" y="156" text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">WRITE IT IN RCTFC</text>

 <g transform="translate(30, 180)" font-size="24" fill="#333">
 <text y="24">Open Gemini / ChatGPT / Claude.</text>
 <text y="48">Write out all five pieces:</text>

 <text y="80"><tspan font-weight="700" fill="#C8102E">R</tspan> Who should the AI be?</text>
 <text y="104"><tspan font-weight="700" fill="#1D428A">C</tspan> What does it need to know?</text>
 <text y="128"><tspan font-weight="700" fill="#00968F">T</tspan> What's the actual task?</text>
 <text y="152"><tspan font-weight="700" fill="#E35205">F</tspan> How should output look?</text>
 <text y="176"><tspan font-weight="700" fill="#7B52AB">C</tspan> Length / tone / rules?</text>

 <rect x="0" y="200" width="320" height="40" rx="20" fill="#F0F5FC"/>
 <text x="160" y="226" text-anchor="middle" font-size="21" font-weight="700" fill="#14306A">Don't skip. Don't shortcut.</text>
 </g>
 </g>

 <!-- arrow 2->3 -->
 <path d="M 823 420 L 863 420" stroke="#C8102E" stroke-width="4" marker-end="url(#stepArrow)"/>

 <!-- Step 3 -->
 <g transform="translate(870, 0)">
 <rect x="0" y="0" width="380" height="400" rx="16" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <circle cx="190" cy="80" r="44" fill="#00968F"/>
 <text x="190" y="96" text-anchor="middle" font-size="42" font-weight="800" fill="#FFFFFF">3</text>
 <text x="190" y="156" text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">SAVE THE PROMPT</text>

 <g transform="translate(30, 180)" font-size="24" fill="#333">
 <text y="24">Somewhere you'll actually find it:</text>

 <text y="64">&#8226; A notes app on your phone</text>
 <text y="90">&#8226; A Google Doc called "My AI prompts"</text>
 <text y="116">&#8226; Apple Notes, OneNote, Evernote</text>
 <text y="142">&#8226; A sticky note on your monitor</text>

 <text y="186">Label it clearly. Paste the prompt.</text>
 <text y="212">Next time you need it &#8212; copy, paste, tweak.</text>

 <rect x="0" y="232" width="320" height="40" rx="20" fill="#E6F4F3"/>
 <text x="160" y="258" text-anchor="middle" font-size="21" font-weight="700" fill="#006F6A">Your prompt library starts here.</text>
 </g>
 </g>

 <!-- arrow 3->4 -->
 <path d="M 1258 420 L 1298 420" stroke="#C8102E" stroke-width="4" marker-end="url(#stepArrow)"/>

 <!-- Step 4 -->
 <g transform="translate(1305, 0)">
 <rect x="0" y="0" width="380" height="400" rx="16" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <circle cx="190" cy="80" r="44" fill="#E35205"/>
 <text x="190" y="96" text-anchor="middle" font-size="42" font-weight="800" fill="#FFFFFF">4</text>
 <text x="190" y="156" text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">REUSE &amp; REFINE</text>

 <g transform="translate(30, 180)" font-size="24" fill="#333">
 <text y="24">Next week when the same task comes up:</text>

 <text y="64">&#8226; Paste your saved prompt</text>
 <text y="90">&#8226; Swap in the new numbers / names</text>
 <text y="116">&#8226; Fix anything that didn't work before</text>
 <text y="142">&#8226; Save the improved version</text>

 <text y="186">In 4 weeks you'll have 4 prompts.</text>
 <text y="212">In 12 months &#8212; a real library.</text>

 <rect x="0" y="232" width="320" height="40" rx="20" fill="#FDF2EA"/>
 <text x="160" y="258" text-anchor="middle" font-size="21" font-weight="700" fill="#A53B02">This is prompt engineering.</text>
 </g>
 </g>
 </g>

 <!-- ============ "Starter example" concrete prompt card ============ -->
 <g transform="translate(100, 650)">
 <rect x="0" y="0" width="1720" height="210" rx="16" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#shadow)"/>
 <rect x="0" y="0" width="8" height="210" rx="4" fill="#C8102E"/>

 <text x="30" y="44" font-size="24" font-weight="800" fill="#C8102E" letter-spacing="2">STEAL THIS &#8212; A READY-TO-USE STARTER</text>
 <text x="30" y="76" font-size="25" font-weight="700" fill="#1A1A1A">Task: "Summarize this chapter for my study guide"</text>

 <g transform="translate(30, 100)">
 <rect x="0" y="0" width="1660" height="90" rx="10" fill="#F7F7F7"/>
 <text x="20" y="28" font-size="24" fill="#333"><tspan font-weight="700" fill="#C8102E">Role: </tspan>You are an accounting tutor helping a first-year community college student.</text>
 <text x="20" y="50" font-size="24" fill="#333"><tspan font-weight="700" fill="#C8102E">Context: </tspan>Attached is a chapter from my textbook. I have my first quiz on Thursday. <tspan font-weight="700" fill="#C8102E">Task: </tspan>Summarize the chapter for a study guide.</text>
 <text x="20" y="72" font-size="24" fill="#333"><tspan font-weight="700" fill="#C8102E">Format: </tspan>5 bullet points for the big ideas, then 8 flashcard-style Q&amp;A pairs. <tspan font-weight="700" fill="#C8102E">Constraints: </tspan>Plain language. No jargon I haven't met yet. Under 400 words.</text>
 </g>
 </g>

 <!-- ============ Bottom bar ============ -->
 <g transform="translate(960, 880)">
 <rect x="-850" y="0" width="1700" height="130" rx="16" fill="#1A1A1A" filter="url(#shadow)"/>
 <text x="-810" y="46" font-size="24" font-weight="700" fill="#FFD76A" letter-spacing="2">ONE WEEK. ONE TASK. ONE PROMPT.</text>
 <text x="-810" y="82" font-size="28" fill="#FFFFFF">If you do the 4 steps above for <tspan font-weight="700" fill="#FFD76A">just one real task</tspan> this week, you'll have crossed from "AI user" to "AI engineer."</text>
 <text x="-810" y="112" font-size="24" fill="#FFFFFF" opacity="0.85">That's the whole difference.</text>
 </g>
</svg>
