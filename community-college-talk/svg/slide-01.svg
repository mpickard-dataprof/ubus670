<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Montserrat, Arial, sans-serif">
 <defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.18"/>
 </filter>
 <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C8102E"/>
 <stop offset="100%" stop-color="#8B1A2B"/>
 </linearGradient>
 <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#FFD76A"/>
 <stop offset="100%" stop-color="#E0A500"/>
 </linearGradient>
 </defs>

 <!-- Background -->
 <rect width="1920" height="1080" fill="url(#bgGrad)"/>

 <!-- faint grid dots -->
 <g fill="#FFFFFF" opacity="0.08">
 <circle cx="120" cy="160" r="2"/><circle cx="240" cy="80" r="2"/>
 <circle cx="380" cy="210" r="2"/><circle cx="620" cy="120" r="2"/>
 <circle cx="1340" cy="180" r="2"/><circle cx="1500" cy="90" r="2"/>
 <circle cx="1700" cy="220" r="2"/><circle cx="1820" cy="120" r="2"/>
 <circle cx="160" cy="940" r="2"/><circle cx="320" cy="860" r="2"/>
 <circle cx="1540" cy="900" r="2"/><circle cx="1740" cy="820" r="2"/>
 </g>

 <!-- Decorative right-side visual: ledger + AI nodes -->
 <g transform="translate(1360, 380)" opacity="0.92">
 <!-- ledger page -->
 <rect x="0" y="0" width="380" height="460" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
 <rect x="0" y="0" width="380" height="56" rx="14" fill="#1D428A"/>
 <text x="190" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">GENERAL LEDGER</text>
 <!-- rows -->
 <g font-size="14" fill="#333">
 <text x="24" y="92" font-weight="700">DATE</text>
 <text x="130" y="92" font-weight="700">DESCRIPTION</text>
 <text x="280" y="92" font-weight="700">DEBIT</text>
 <line x1="16" y1="104" x2="364" y2="104" stroke="#DDD" stroke-width="1"/>
 <text x="24" y="134">4/01</text><text x="130" y="134">Office supplies</text><text x="280" y="134">142</text>
 <line x1="16" y1="148" x2="364" y2="148" stroke="#F0F0F0" stroke-width="1"/>
 <text x="24" y="174">4/03</text><text x="130" y="174">Software sub.</text><text x="280" y="174">89</text>
 <line x1="16" y1="188" x2="364" y2="188" stroke="#F0F0F0" stroke-width="1"/>
 <text x="24" y="214">4/05</text><text x="130" y="214">Client refund</text><line x1="16" y1="228" x2="364" y2="228" stroke="#F0F0F0" stroke-width="1"/>
 <text x="24" y="254">4/08</text><text x="130" y="254">Travel - airfare</text><text x="280" y="254">420</text>
 <line x1="16" y1="268" x2="364" y2="268" stroke="#F0F0F0" stroke-width="1"/>
 <text x="24" y="294">4/12</text><text x="130" y="294">Depreciation</text><text x="280" y="294">180</text>
 <line x1="16" y1="308" x2="364" y2="308" stroke="#F0F0F0" stroke-width="1"/>
 <text x="24" y="334">4/15</text><text x="130" y="334">Client invoice</text><line x1="16" y1="348" x2="364" y2="348" stroke="#F0F0F0" stroke-width="1"/>
 <text x="24" y="374">4/18</text><text x="130" y="374">Payroll tax</text><text x="280" y="374">612</text>
 <line x1="16" y1="388" x2="364" y2="388" stroke="#F0F0F0" stroke-width="1"/>
 <text x="24" y="414">4/21</text><text x="130" y="414">Rent - office</text><text x="280" y="414">2,100</text>
 </g>
 <!-- AI nodes overlay -->
 <g>
 <circle cx="430" cy="-60" r="40" fill="#FFFFFF" opacity="0.95"/>
 <circle cx="430" cy="-60" r="24" fill="#C8102E"/>
 <text x="430" y="-50" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">AI</text>
 <line x1="400" y1="-30" x2="320" y2="90" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
 <line x1="415" y1="-18" x2="340" y2="230" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
 <line x1="408" y1="-28" x2="330" y2="380" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
 <circle cx="320" cy="90" r="6" fill="#FFD76A"/>
 <circle cx="340" cy="230" r="6" fill="#FFD76A"/>
 <circle cx="330" cy="380" r="6" fill="#FFD76A"/>
 </g>
 </g>

 <!-- Title block -->
 <g transform="translate(120, 380)">
 <text x="0" y="0" font-size="30" font-weight="600" fill="#FFD76A" letter-spacing="4">GUEST LECTURE</text>

 <text x="0" y="110" font-size="108" font-weight="800" fill="#FFFFFF">AI for the Next</text>
 <text x="0" y="228" font-size="108" font-weight="800" fill="#FFFFFF">Generation of</text>
 <text x="0" y="346" font-size="108" font-weight="800" fill="#FFD76A">Accountants</text>

 <text x="0" y="420" font-size="35" font-weight="500" fill="#FFFFFF" opacity="0.92">A 60-minute hands-on tour of how AI actually works —</text>
 <text x="0" y="464" font-size="35" font-weight="500" fill="#FFFFFF" opacity="0.92">and how to use it well in your accounting career.</text>
 </g>

 <!-- Bottom agenda strip -->
 <g transform="translate(120, 920)">
 <rect x="0" y="0" width="1680" height="106" rx="14" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
 <text x="32" y="42" font-size="24" font-weight="700" fill="#FFD76A" letter-spacing="3">TODAY'S JOURNEY</text>

 <!-- 4 steps -->
 <g font-family="Montserrat, Arial, sans-serif" fill="#FFFFFF">
 <g transform="translate(38, 64)">
 <circle cx="0" cy="14" r="18" fill="#FFFFFF"/>
 <text x="0" y="20" text-anchor="middle" font-size="24" font-weight="800" fill="#C8102E">1</text>
 <text x="30" y="12" font-size="24" font-weight="700">INSIDE THE BOX</text>
 <text x="30" y="32" font-size="21" opacity="0.85">How AI actually thinks</text>
 </g>
 <g transform="translate(462, 64)">
 <circle cx="0" cy="14" r="18" fill="#FFFFFF"/>
 <text x="0" y="20" text-anchor="middle" font-size="24" font-weight="800" fill="#C8102E">2</text>
 <text x="30" y="12" font-size="24" font-weight="700">HALLUCINATIONS</text>
 <text x="30" y="32" font-size="21" opacity="0.85">Why AI lies — and how to stop it</text>
 </g>
 <g transform="translate(886, 64)">
 <circle cx="0" cy="14" r="18" fill="#FFFFFF"/>
 <text x="0" y="20" text-anchor="middle" font-size="24" font-weight="800" fill="#C8102E">3</text>
 <text x="30" y="12" font-size="24" font-weight="700">PROMPT ENGINEERING</text>
 <text x="30" y="32" font-size="21" opacity="0.85">One framework (RCTFC) + structure</text>
 </g>
 <g transform="translate(1310, 64)">
 <circle cx="0" cy="14" r="18" fill="#FFFFFF"/>
 <text x="0" y="20" text-anchor="middle" font-size="24" font-weight="800" fill="#C8102E">4</text>
 <text x="30" y="12" font-size="24" font-weight="700">CONTEXT + RAG</text>
 <text x="30" y="32" font-size="21" opacity="0.85">Make AI use YOUR documents</text>
 </g>
 </g>
 </g>
</svg>
